# fly.toml — Fly.io configuration for CropGrader backend
# Deploy: cd backend && fly launch (or fly deploy)

app = 'cropgrader-api'
primary_region = 'sin'       # Singapore — change if needed

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  ML_SERVICE_URL = 'http://localhost:5001'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
