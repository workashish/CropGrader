# render.yaml — Render Infrastructure-as-Code
# Deploy: connect repo on https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: cropgrader-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: node app.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # set manually in Render dashboard
      - key: ML_SERVICE_URL
        value: http://localhost:5001
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
